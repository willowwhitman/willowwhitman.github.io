name: Domain failover check
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/failover.py
      - name: Commit any switch, plus a monthly heartbeat
        run: |
          # GitHub pauses scheduled workflows on repos with no commits for 60
          # days; the heartbeat keeps this check alive while nothing else changes.
          if [ "$(date -u +%d)" = "01" ]; then date -u +%F > .github/heartbeat; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Failover check $(date -u +%F)"
          git push
          # A push made with this token does not start the Pages build by itself.
          curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds
