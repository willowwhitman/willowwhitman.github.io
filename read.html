<style>
/* ── reader chrome (page-specific) ───────────────────────── */
html,body{height:100%}
body{overflow:hidden}
body::before{display:none}

.reader{
  position:relative;z-index:1;
  display:flex;flex-direction:column;
  height:100dvh;
}

/* top bar */
.rd-top{
  display:flex;align-items:center;gap:12px;
  padding:0 clamp(10px,2vw,22px);height:58px;flex:none;
  background:rgba(11,15,28,.94);
  border-bottom:1px solid var(--border);
}
.rd-top .gear{width:22px;height:22px;flex:none;filter:drop-shadow(0 0 4px rgba(196,84,26,.35))}
.rd-title{
  font-family:var(--serif);font-size:.95rem;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
}
.rd-title a{color:var(--fg)}
.rd-tools{display:flex;align-items:center;gap:8px;flex:none;margin-left:auto}
.rd-btn{
  appearance:none;background:var(--surface);color:var(--fg-2);
  border:1px solid var(--border);border-radius:8px;
  font:inherit;font-size:.82rem;line-height:1;
  padding:8px 11px;cursor:pointer;white-space:nowrap;
  transition:background .15s ease,color .15s ease,border-color .15s ease;
}
.rd-btn:hover{background:var(--surface-2);color:var(--fg);border-color:var(--border-2)}
.rd-btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-text);border-color:var(--accent)}
.rd-exit{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.rd-exit:hover{background:var(--accent-hi);border-color:var(--accent-hi);color:#fff}

/* mode switch */
.rd-mode{display:flex;flex:none;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.rd-mode button{
  appearance:none;background:none;border:0;color:var(--muted);
  font:inherit;font-size:.8rem;line-height:1;padding:9px 12px;cursor:pointer;
}
.rd-mode button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-text)}
.rd-mode button:not([aria-pressed="true"]):hover{color:var(--fg)}

/* layout: sidebar + stage */
.rd-body{display:flex;flex:1;min-height:0}

.rd-toc{
  width:300px;flex:none;overflow-y:auto;
  background:var(--bg-2);border-right:1px solid var(--border);
  padding:18px 0 28px;
  transition:margin-left .2s ease;
}
.rd-toc.closed{margin-left:-301px}
.rd-toc h2{
  font-family:var(--sans);font-size:.72rem;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--accent-text);
  padding:0 20px;margin-bottom:10px;
}
.rd-toc ol{list-style:none}
.rd-toc li a{
  display:block;padding:7px 20px;font-size:.85rem;color:var(--fg-2);
  border-left:2px solid transparent;line-height:1.4;cursor:pointer;
}
.rd-toc li a:hover{color:var(--fg);background:var(--surface)}
.rd-toc li a.current{color:var(--accent-text);border-left-color:var(--accent);background:var(--accent-soft)}
.rd-toc li ol a{padding-left:34px;font-size:.8rem;color:var(--muted)}

.rd-stage{flex:1;min-width:0;position:relative;background:#141927;transition:background .2s ease}
body[data-rtheme="light"][data-rmode="epub"] .rd-stage{background:#F6F1E7}

#viewer{position:absolute;inset:0}
#viewer.pdf-scroll{overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable}

/* pdf pages */
.pdf-page{
  position:relative;margin:18px auto;background:#fff;
  box-shadow:0 6px 28px rgba(0,0,0,.5);
}
.pdf-page canvas{display:block;width:100%;height:100%}
.pdf-page .pnum{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#999;font-size:.8rem;
}

/* loading / error states */
.rd-status{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;text-align:center;
  padding:24px;z-index:5;background:#141927;
}
.rd-status[hidden]{display:none}
.rd-status .spin{
  width:30px;height:30px;border-radius:50%;
  border:3px solid var(--border-2);border-top-color:var(--accent-hi);
  animation:rspin .9s linear infinite;
}
@keyframes rspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.rd-status .spin{animation:none;border-top-color:var(--border-2)}}

/* page-turn zones (epub mode only) */
.rd-arrow{
  position:absolute;top:0;bottom:0;width:clamp(40px,6vw,76px);
  display:flex;align-items:center;justify-content:center;
  background:none;border:0;cursor:pointer;z-index:4;
  color:var(--muted);font-size:1.6rem;opacity:.55;
  transition:opacity .15s ease,color .15s ease;
}
.rd-arrow:hover{opacity:1;color:var(--accent-text)}
body[data-rtheme="light"][data-rmode="epub"] .rd-arrow{color:rgba(30,25,18,.45)}
body[data-rtheme="light"][data-rmode="epub"] .rd-arrow:hover{color:#A34314}
.rd-prev{left:0}
.rd-next{right:0}
body[data-rmode="pdf"] .rd-arrow{display:none}

/* bottom bar */
.rd-foot{
  display:flex;align-items:center;gap:14px;flex:none;
  padding:0 clamp(10px,2vw,22px);height:46px;
  background:rgba(11,15,28,.94);
  border-top:1px solid var(--border);
  font-size:.78rem;color:var(--muted);
}
.rd-chapter{
  flex:none;max-width:34%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.rd-progress{flex:1;display:flex;align-items:center;gap:10px;min-width:60px}
.rd-bar{flex:1;height:3px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.rd-bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .3s ease}
.rd-pct{flex:none;font-variant-numeric:tabular-nums}
.rd-remember{display:flex;align-items:center;gap:7px;flex:none;cursor:pointer;color:var(--muted)}
.rd-remember input{accent-color:var(--accent)}
.rd-remember:hover{color:var(--fg-2)}

/* mobile — the Quick exit button must never leave the screen */
@media (max-width:760px){
  .rd-toc{
    position:absolute;z-index:20;top:0;bottom:0;left:0;
    box-shadow:12px 0 40px rgba(0,0,0,.5);
  }
  .rd-title{display:none}
  .rd-btn{padding:8px 9px;font-size:.78rem}
  .rd-chapter{display:none}
  .rd-remember span{display:none}
  .rd-remember::after{content:"Save place";font-size:.72rem}
}
@media (max-width:620px){
  .rd-top{gap:8px;padding-inline:8px}
  .rd-top > a{display:none}
  .rd-tools{gap:5px;margin-left:0;width:100%;justify-content:space-between}
  .rd-btn{padding:8px 8px;font-size:.74rem}
  .rd-mode button{padding:9px 9px;font-size:.74rem}
  .qe-label{display:none}
  .rd-exit{font-size:.95rem;padding:7px 12px}
}
@media (max-width:380px){
  #theme-btn{display:none}
}

/* fallback content for no-JS */
.rd-nojs{padding:40px 20px;max-width:640px;margin:0 auto}
</style>
</head>
